# ─────────────────────────────────────────────────────────────────────────────
# tempmail — PRODUCTION. Single image (frontend + backend + SMTP in one).
#
#   docker compose --env-file .env -f docker/prod/docker-compose.yaml up -d
#   (env keys live in the repo-root .env; compose defaults otherwise)
#
# The `app` container serves the SPA, REST API, Socket.IO realtime, and the
# SMTP receiver. Brand/MX are runtime env (see app.environment) so one image
# can be rebranded without a rebuild.
# WARNING: all env keys are TEMPMAIL_-prefixed (root .env). Images built
# before the rename read the old names — after building + pushing the prod
# image manually (docker build -f docker/prod/Dockerfile + docker push),
# run `docker compose -f docker/prod/docker-compose.yaml pull && \
# docker compose -f docker/prod/docker-compose.yaml up -d`; an old
# binary silently falls back to defaults (port 5001, postgres localhost).
# For local development with hot-reload, use docker/dev/docker-compose.yaml.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── app: single image — SPA + Go API (:8080) + SMTP (:2525) ──
  app:
    # build:
    #   context: .
    #   dockerfile: docker/prod/Dockerfile
    image: ${TEMPMAIL_APP_IMAGE:-ghcr.io/zengkuni/tempmail-xgmail:latest}
    container_name: tempmail-app
    restart: unless-stopped
    ports:
      - "8080:8080" # HTTP: SPA + /api + /socket.io
      - "25:2525" # SMTP intake (host :25 → app)
      - "2525:2525" # SMTP intake (direct, optional)
    environment:
      TEMPMAIL_PORT: ${TEMPMAIL_PORT:-8080}
      TEMPMAIL_SMTP_PORT: ${TEMPMAIL_SMTP_PORT:-2525}
      TEMPMAIL_STATIC_DIR: ${TEMPMAIL_STATIC_DIR:-/app/dist}
      TEMPMAIL_POSTGRES_URL: ${TEMPMAIL_POSTGRES_URL:-postgres://tempmail:tempmail@postgres:5432/tempmail?sslmode=disable}
      TEMPMAIL_REDIS_URL: ${TEMPMAIL_REDIS_URL:-redis://valkey:6379/0}
      TEMPMAIL_APP_ENV: ${TEMPMAIL_APP_ENV:-production}
      # ── runtime brand (public; rendered into /config.js, no rebuild) ──
      TEMPMAIL_BRAND: ${TEMPMAIL_BRAND:-xgmail}
      TEMPMAIL_MX: ${TEMPMAIL_MX_TARGET:-email.xgmail.bond}
      # ── backend config ──
      TEMPMAIL_PUBLIC_API_KEY: ${TEMPMAIL_PUBLIC_API_KEY:-public-dev-key}
      TEMPMAIL_DEFAULT_DOMAIN: ${TEMPMAIL_DEFAULT_DOMAIN:-mail.tempmail.dev}
      TEMPMAIL_MX_TARGET: ${TEMPMAIL_MX_TARGET:-email.xgmail.bond}
      TEMPMAIL_SMTP_GREETING: ${TEMPMAIL_SMTP_GREETING:-mail.xgmail.bond}
      TEMPMAIL_REDIS_PREFIX: ${TEMPMAIL_REDIS_PREFIX:-tempmail-xgmail:}
      TEMPMAIL_FRONTEND_URL: ${TEMPMAIL_FRONTEND_URL:-http://localhost:8080}
      TEMPMAIL_MAX_INBOX_EXPIRATION: ${TEMPMAIL_MAX_INBOX_EXPIRATION:-24h}
      TEMPMAIL_RATE_LIMIT_API_MAX: ${TEMPMAIL_RATE_LIMIT_API_MAX:-300}
      TEMPMAIL_RATE_LIMIT_API_WINDOW_MINUTES: ${TEMPMAIL_RATE_LIMIT_API_WINDOW_MINUTES:-15}
      TEMPMAIL_RATE_LIMIT_STRICT_MAX: ${TEMPMAIL_RATE_LIMIT_STRICT_MAX:-20}
      TEMPMAIL_RATE_LIMIT_STRICT_WINDOW_MINUTES: ${TEMPMAIL_RATE_LIMIT_STRICT_WINDOW_MINUTES:-1}
      TEMPMAIL_DNS_RESOLVERS: ${TEMPMAIL_DNS_RESOLVERS:-1.1.1.1:53,8.8.8.8:53,9.9.9.9:53}
      TEMPMAIL_DNS_LOOKUP_TIMEOUT: ${TEMPMAIL_DNS_LOOKUP_TIMEOUT:-3s}
      TEMPMAIL_DNS_LOOKUP_ROUNDS: ${TEMPMAIL_DNS_LOOKUP_ROUNDS:-2}
      TEMPMAIL_DNS_LOOKUP_SAMPLE: ${TEMPMAIL_DNS_LOOKUP_SAMPLE:-8}
      TEMPMAIL_DNS_RESOLVERS_URL: ${TEMPMAIL_DNS_RESOLVERS_URL:-https://raw.githubusercontent.com/proabiral/Fresh-Resolvers/refs/heads/master/resolvers.txt}
      TEMPMAIL_DNS_RESOLVERS_REFRESH: ${TEMPMAIL_DNS_RESOLVERS_REFRESH:-24h}
      TEMPMAIL_DOMAIN_MX_GRACE: ${TEMPMAIL_DOMAIN_MX_GRACE:-10m}
      TEMPMAIL_MX_SWEEP_INTERVAL: ${TEMPMAIL_MX_SWEEP_INTERVAL:-1m}
      TEMPMAIL_MX_REFRESH_INTERVAL: ${TEMPMAIL_MX_REFRESH_INTERVAL:-30m}
      TEMPMAIL_RDAP_REFRESH_INTERVAL: ${TEMPMAIL_RDAP_REFRESH_INTERVAL:-24h}
      TEMPMAIL_RDAP_CACHE_TTL: ${TEMPMAIL_RDAP_CACHE_TTL:-24h}
    depends_on:
      - postgres
      - valkey

  # ── PostgreSQL (schema auto-created at boot by the backend) ──
  postgres:
    image: postgres:16-alpine
    container_name: tempmail-postgres
    restart: always
    # No host port by default: use `docker exec -it tempmail-postgres psql -U tempmail`.
    environment:
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: tempmail
      POSTGRES_DB: tempmail
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ── Valkey (Redis-compatible; go-redis/asynq client unchanged) ──
  valkey:
    image: valkey/valkey:8-alpine
    container_name: tempmail-valkey
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

volumes:
  postgres-data:
    name: postgres-data
  valkey-data:
    name: valkey-data

networks:
  default:
    name: tempmail-server
    driver: bridge
