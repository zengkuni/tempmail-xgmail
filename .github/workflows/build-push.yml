name: build-push

# Build dev + prod images and push to GitHub Container Registry.
# Pushes on every main-branch commit and on tags v*.
# Package visibility is managed at github.com/<owner>/<repo>/packages.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Tag pushes made with the default GITHUB_TOKEN do NOT re-trigger
    # workflows, so the auto-bumped tag cannot loop.
    strategy:
      matrix:
        include:
          - name: dev
            dockerfile: docker/dev/Dockerfile
          - name: prod
            dockerfile: docker/prod/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Auto version-bump on v* tag pushes: compute `next` in BOTH matrix jobs
      # (needed for the tag list), but create+push the tag only once — from the
      # prod job — so the dev job cannot fail with "already exists". The push
      # uses the default GITHUB_TOKEN → does not re-trigger this workflow.
      - name: Compute next version (push tag from prod only)
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ref="${{ github.ref_name }}"
          base="${ref#v}"
          IFS=. read -r major minor patch <<< "$base"
          next="v${major}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.name }}" = "prod" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$next" -m "auto-bump from $ref" "${{ github.sha }}"
            git push origin "$next"
          fi

      - name: Compute image tags
        id: meta
        run: |
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/tempmail-xgmail
          tags="$image:sha-${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            if [ "${{ matrix.name }}" = "prod" ]; then
              tags="$image:${{ steps.version.outputs.next }},$tags,$image:latest"
            fi
          else
            tags="$image:${{ matrix.name }},$tags"
            if [ "${{ matrix.name }}" = "prod" ]; then
              tags="$tags,$image:latest"
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
