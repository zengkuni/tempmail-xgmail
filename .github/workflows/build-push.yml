name: build-push

# Build the PROD image (frontend + backend + SMTP in one) ONCE and push it to
# GitHub Container Registry (GHCR) and Docker Hub (docker.io) from the same
# build-push step. Dev never hits the registry: the dev stack runs the backend
# from source (docker/dev/docker-compose.yaml, no image build).
#
# Triggers: push on main, push of tags v*, or manual dispatch.
# On a tag push v1.0.0 the workflow auto-bumps to v1.0.1 (annotated tag on the
# same commit) — pushed with the default GITHUB_TOKEN, which does NOT
# re-trigger workflows, so the bump cannot loop. Images pushed:
#   tag push : v1.0.1, sha-<commit>, latest   (multi-arch amd64+arm64)
#   main push: prod, sha-<commit>, latest
# GHCR always; Docker Hub only when credentials resolve — from the .env in the
# private repo zengkuni/private-env (needs ENV_REPO_TOKEN) or from repo
# secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN as fallback. The Docker Hub image
# is docker.io/<username>/tempmail-xgmail with the same tag scheme on both.
# Package visibility is managed at github.com/<owner>/<repo>/packages.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker Hub credentials come from the .env in zengkuni/private-env
  # (loaded by the "Load Docker Hub .env" step below; ENV_REPO_TOKEN needs
  # contents:read on that repo). Secrets below are only a fallback so CI
  # still works if the private-env checkout is skipped.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  ENV_REPO_TOKEN: ${{ secrets.ENV_REPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/push the auto-bumped tag
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Source of truth for DOCKERHUB_USERNAME / DOCKERHUB_TOKEN is the .env
      # in the private repo zengkuni/private-env (not this repo's secrets).
      # ENV_REPO_TOKEN: classic PAT with `repo`, or fine-grained token with
      # contents:read on zengkuni/private-env.
      - name: Load Docker Hub .env from private-env repo
        if: ${{ env.ENV_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: zengkuni/private-env
          ref: main
          token: ${{ env.ENV_REPO_TOKEN }}
          path: private-env
          sparse-checkout: .env
          persist-credentials: false

      # Export the DOCKERHUB_* keys from that .env into $GITHUB_ENV so later
      # steps (login + tag computation) see them. File values win over the
      # secrets fallback in the workflow env block.
      - name: Export Docker Hub credentials from .env
        if: ${{ env.ENV_REPO_TOKEN != '' }}
        run: |
          envfile="$GITHUB_WORKSPACE/private-env/.env"
          [ -f "$envfile" ] || { echo "::error::private-env/.env not found"; exit 1; }
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"                    # strip comments
            line="${line#"${line%%[![:space:]]*}"}"   # ltrim
            line="${line%"${line##*[![:space:]]}"}"   # rtrim
            [ -z "$line" ] && continue
            key="${line%%=*}"
            val="${line#*=}"
            case "$key" in
              DOCKERHUB_*)
                val="${val%\"}"; val="${val#\"}"  # unquote if present
                echo "$key=$val" >> "$GITHUB_ENV"
                echo "loaded $key (value masked)"
                ;;
            esac
          done < "$envfile"

      # Skipped while DOCKERHUB_TOKEN stays empty (no ENV_REPO_TOKEN and no
      # secrets fallback) — an unconditional docker.io login would fail the job.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Auto version-bump on v* tag pushes: create + push v1.0.1 on the same
      # commit the tag points at.
      - name: Compute next version (push tag)
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ref="${{ github.ref_name }}"
          base="${ref#v}"
          IFS=. read -r major minor patch <<< "$base"
          next="v${major}.${minor}.$((patch + 1))"
          git tag -a "$next" -m "auto-bump from $ref" "${{ github.sha }}"
          git push origin "$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        run: |
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/tempmail-xgmail
          tags="$image:sha-${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$image:${{ steps.version.outputs.next }},$tags,$image:latest"
          else
            tags="$image:prod,$tags,$image:latest"
          fi
          # Same tag scheme for Docker Hub, appended to the SAME tags list so
          # one multi-arch build pushes to both registries (no second build).
          if [[ -n "${{ env.DOCKERHUB_TOKEN }}" ]]; then
            dh=docker.io/${{ env.DOCKERHUB_USERNAME }}/tempmail-xgmail
            dhtags="$dh:sha-${{ github.sha }}"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              dhtags="$dh:${{ steps.version.outputs.next }},$dhtags,$dh:latest"
            else
              dhtags="$dh:prod,$dhtags,$dh:latest"
            fi
            tags="$tags,$dhtags"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Single multi-arch build; pushes every registry/tag pair in $tags.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
