name: build-push

# Build the PROD image (frontend + backend + SMTP in one) and push it to
# GitHub Container Registry. Dev never hits the registry: the dev stack runs
# the backend from source (docker/dev/docker-compose.yaml, no image build).
#
# Triggers: push on main, push of tags v*, or manual dispatch.
# On a tag push v1.0.0 the workflow auto-bumps to v1.0.1 (annotated tag on the
# same commit) — pushed with the default GITHUB_TOKEN, which does NOT
# re-trigger workflows, so the bump cannot loop. Images pushed:
#   tag push : v1.0.1, sha-<commit>, latest   (multi-arch amd64+arm64)
#   main push: prod, sha-<commit>, latest
# Package visibility is managed at github.com/<owner>/<repo>/packages.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/push the auto-bumped tag
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Auto version-bump on v* tag pushes: create + push v1.0.1 on the same
      # commit the tag points at.
      - name: Compute next version (push tag)
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ref="${{ github.ref_name }}"
          base="${ref#v}"
          IFS=. read -r major minor patch <<< "$base"
          next="v${major}.${minor}.$((patch + 1))"
          git tag -a "$next" -m "auto-bump from $ref" "${{ github.sha }}"
          git push origin "$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/tempmail-xgmail
          tags="$image:sha-${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$image:${{ steps.version.outputs.next }},$tags,$image:latest"
          else
            tags="$image:prod,$tags,$image:latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
