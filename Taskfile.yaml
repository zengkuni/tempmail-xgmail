version: '3'

# Run the dev stack: Go backend + PostgreSQL + Valkey (source-mounted, schema
# auto-created on backend boot). Frontend dev server runs on the host:
#   cd frontend && npm run dev
#
# Env vars come from the repo-root .env (--env-file .env) — compose otherwise
# falls back to the in-stack services (TEMPMAIL_POSTGRES_URL / TEMPMAIL_REDIS_URL
# default to postgres:5432 / redis://valkey:6379/0).
#
# Usage:
#   task dev        # start the dev stack (detached)
#   task dev -- logs   # logs follow use: docker compose -f ... logs -f backend

vars:
  COMPOSE_FILE: docker/dev/docker-compose.yaml

tasks:
  dev:
    desc: Start the dev stack (backend + postgres + valkey)
    cmds:
      - docker compose --env-file .env -f {{.COMPOSE_FILE}} up -d --wait
